name: build

on:
  workflow_dispatch:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - name: Check Out Repo
        uses: actions/checkout@v4

      - name: Get Third-Party Cache
        id: third-party-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            third_party
          key: third-party-ios-${{ hashFiles('DEPS') }}-${{ hashFiles('vendor.json') }}
          restore-keys: third-party-ios-

      - uses: tecolicom/actions-use-homebrew-tools@v1
        with:
          tools: ninja yasm 0x1306a94/tap/depctl

      - name: Install Build Tools
        run: |
          chmod +x install_tools.sh
          ./install_tools.sh
        shell: bash

      - name: Run depctl
        run: |
          depctl --version
          depctl
        shell: bash

      - name: Build iOS
        run: |
          ./ios/gen_ios -DENABLE_TIME_PROFILER=ON
          xcodebuild -workspace ios/SeatCanvas.xcworkspace -scheme SeatCanvasSample -configuration Release -sdk iphoneos -arch arm64 CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO

      - name: Save Third-Party Cache
        if: ${{ (github.event_name == 'push') && (steps.third-party-cache.outputs.cache-hit != 'true') }}
        uses: actions/cache/save@v4
        with:
          path: |
            third_party
          key: third-party-ios-${{ hashFiles('DEPS') }}-${{ hashFiles('vendor.json') }}

      - name: Job Failed
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: ios_build
          path: ios

  android:
    runs-on: ubuntu-latest
    steps:
      - name: Check Out Repo
        uses: actions/checkout@v4

      - name: Get Third-Party Cache
        id: third-party-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            third_party
          key: third-party-android-${{ hashFiles('DEPS') }}-${{ hashFiles('vendor.json') }}
          restore-keys: third-party-android-

      - name: Get depctl Cache
        id: depctl-cache
        uses: actions/cache@v4
        with:
          path: ~/depctl
          key: depctl-fd8da7953a56c52e480c49d34acacdc23348226c8618e028b2caeaf67d9f83d2
          restore-keys: depctl-

      - name: Install depctl
        if: steps.depctl-cache.outputs.cache-hit != 'true'
        run: |
          DEPCTL_URL="https://github.com/0x1306a94/depctl/releases/download/v1.4.5/depctl-linux-x86_64.tar.gz"
          curl -L -o /tmp/depctl.tar.gz "$DEPCTL_URL"
          rm -rf ~/depctl
          mkdir -p ~/depctl
          tar -xzf /tmp/depctl.tar.gz -C ~/depctl
          chmod +x ~/depctl/depctl

      - name: Configure depctl PATH
        run: |
          echo "$HOME/depctl" >> $GITHUB_PATH

      - name: Run depctl
        run: |
          depctl --version
          depctl
        shell: bash

      - uses: seanmiddleditch/gha-setup-ninja@master

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Build Android
        run: |
          cd android/SeatCanvasSample
          ./gradlew assembleRelease -Parm64-only --no-daemon

      - name: Save Third-Party Cache
        if: ${{ (github.event_name == 'push') && (steps.third-party-cache.outputs.cache-hit != 'true') }}
        uses: actions/cache/save@v4
        with:
          path: |
            third_party
          key: third-party-android-${{ hashFiles('DEPS') }}-${{ hashFiles('vendor.json') }}

      - name: Job Failed
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: android_build
          path: android


  ohos:
    runs-on: macos-latest
    steps:
      - name: Check Out Repo
        uses: actions/checkout@v4

      - name: Get CLI Tools Cache
        id: cli-tools-cache
        uses: actions/cache@v4
        with:
          path: ~/ohos-cmd-tools
          key: ohos-cli-6.0.0.868-mac-arm64-v2
          restore-keys: ohos-cli-

      - name: Install CLI Tools
        if: steps.cli-tools-cache.outputs.cache-hit != 'true'
        run: |
          TOOLS_URL="https://github.com/libpag/ohos-sdk/releases/download/6.0.0.868/commandline-tools-mac-arm64-6.0.0.868.zip"
          curl -L -o /tmp/cmdtools.zip "$TOOLS_URL"
          unzip -q /tmp/cmdtools.zip -d /tmp
          mv /tmp/command-line-tools ~/ohos-cmd-tools

      - name: Configure Environment
        run: |
          CLI_DIR=~/ohos-cmd-tools
          echo "$CLI_DIR/sdk/default/openharmony/toolchains" >> $GITHUB_PATH
          echo "$CLI_DIR/ohpm/bin"                       >> $GITHUB_PATH
          echo "$CLI_DIR/hvigor/bin"                     >> $GITHUB_PATH
          echo "DEVECO_SDK_HOME=$CLI_DIR/sdk"            >> $GITHUB_ENV
          echo "JAVA_HOME=$JAVA_HOME"                    >> $GITHUB_ENV

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup pnpm
        run: |
          npm install -g pnpm@8.13.1
          echo "$(npm prefix -g)/bin" >> $GITHUB_PATH

      - name: Cache hvigor & ohpm
        uses: actions/cache@v4
        with:
          path: |
            ~/.hvigor
            ~/.ohpm
            ohos/.hvigor
          key: hvigor-${{ runner.os }}-${{ hashFiles('**/oh-package.json5', '**/hvigorfile.ts') }}
          restore-keys: |
            hvigor-${{ runner.os }}-

      - name: Get Third-Party Cache
        id: third-party-cache
        uses: actions/cache/restore@v4
        with:
          path: third_party
          key: third-party-ohos-${{ hashFiles('DEPS') }}-${{ hashFiles('vendor.json') }}
          restore-keys: third-party-ohos-
      
      - uses: tecolicom/actions-use-homebrew-tools@v1
        with:
          tools: ninja yasm 0x1306a94/tap/depctl

      - name: Run depctl
        run: |
          depctl --version
          depctl
        shell: bash

      - name: Install ohpm dependencies
        run: |
          cd ohos
          ohpm config set registry https://ohpm.openharmony.cn/ohpm/
          ohpm install --all

      - name: Build Harmony
        run: |
          cd ohos
          hvigorw assembleHar --mode module -p module=libseatcanvas@default -p buildMode=release -p product=default --no-daemon

      - name: Save Third-Party Cache
        if: ${{ (github.event_name == 'push') && (steps.third-party-cache.outputs.cache-hit != 'true') }}
        uses: actions/cache/save@v4
        with:
          path: third_party
          key: third-party-ohos-${{ hashFiles('DEPS') }}-${{ hashFiles('vendor.json') }}

      - name: Job Failed
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: ohos_build
          path: ohos/out