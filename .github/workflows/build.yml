name: build

on:
  workflow_dispatch:
  pull_request:
    branches: [master, develop]
  push:
    branches: [master, develop]

jobs:
  third-party:
    runs-on: ubuntu-latest
    steps:
      - name: Check Out Repo
        uses: actions/checkout@v4

      - name: Get Third-Party Cache
        id: third-party-cache
        uses: actions/cache/restore@v4
        with:
          path: third_party
          key: third-party-${{ hashFiles('DEPS') }}
          restore-keys: third-party-

      - name: Get depctl Cache
        id: depctl-cache
        uses: actions/cache@v4
        with:
          path: ~/depctl
          key: depctl-linux-x86_64-69ac32ee

      - name: Install depctl
        if: steps.depctl-cache.outputs.cache-hit != 'true'
        run: |
          DEPCTL_URL="https://github.com/0x1306a94/depctl/releases/download/v1.4.7/depctl-linux-x86_64.tar.gz"
          curl -L -o /tmp/depctl.tar.gz "$DEPCTL_URL"
          rm -rf ~/depctl
          mkdir -p ~/depctl
          tar -xzf /tmp/depctl.tar.gz -C ~/depctl
          chmod +x ~/depctl/depctl

      - name: Save depctl Cache
        if: steps.depctl-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/depctl
          key: depctl-linux-x86_64-69ac32ee

      - name: Configure depctl PATH
        run: echo "$HOME/depctl" >> $GITHUB_PATH

      - name: Run depctl
        run: |
          depctl --version
          depctl --skip-paths third_party/tgfx/third_party/shaderc
        shell: bash

      - name: Save Third-Party Cache
        if: steps.third-party-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: third_party
          key: third-party-${{ hashFiles('DEPS') }}

  ios:
    needs: third-party
    runs-on: macos-26
    steps:
      - name: Check Out Repo
        uses: actions/checkout@v4

      - name: Get Third-Party Cache
        uses: actions/cache/restore@v4
        with:
          path: third_party
          key: third-party-${{ hashFiles('DEPS') }}
          restore-keys: third-party-

      - uses: tecolicom/actions-use-homebrew-tools@v1
        with:
          tools: cmake ninja yasm git-lfs

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.4.1"

      - name: Build iOS
        run: |
          ./ios/gen_ios -DENABLE_TIME_PROFILER=ON
          xcodebuild -workspace ios/SeatCanvas.xcworkspace \
          -scheme SeatCanvasSample \
          -configuration Release \
          -sdk iphoneos \
          -arch arm64 \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO

      - name: Job Failed
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: ios_build
          path: ios

  android:
    needs: third-party
    runs-on: ubuntu-latest
    steps:
      - name: Check Out Repo
        uses: actions/checkout@v4

      - name: Get Third-Party Cache
        uses: actions/cache/restore@v4
        with:
          path: third_party
          key: third-party-${{ hashFiles('DEPS') }}
          restore-keys: third-party-

      - uses: seanmiddleditch/gha-setup-ninja@master

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Build Android
        run: |
          cd android/SeatCanvasSample
          ./gradlew assembleRelease -Parm64-only --no-daemon

      - name: Job Failed
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: android_build
          path: android

  web:
    needs: third-party
    runs-on: ubuntu-latest
    env:
      EMSDK_QUIET: 1
    steps:
      - name: Check Out Repo
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Get Third-Party Cache
        uses: actions/cache/restore@v4
        with:
          path: third_party
          key: third-party-${{ hashFiles('DEPS') }}
          restore-keys: third-party-

      - name: Get node_modules Cache
        id: node-cache
        uses: actions/cache/restore@v4
        with:
          path: web/node_modules
          key: node-modules-web-${{ hashFiles('web/package-lock.json') }}
          restore-keys: node-modules-web-

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: seanmiddleditch/gha-setup-ninja@master

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake

      - name: Verify demo fonts (Git LFS)
        run: |
          test -f resources/fonts/NotoSansSC-Regular.otf
          test -f resources/fonts/NotoColorEmoji.ttf
          test "$(wc -c < resources/fonts/NotoSansSC-Regular.otf)" -gt 1000000
          test "$(wc -c < resources/fonts/NotoColorEmoji.ttf)" -gt 1000000

      - name: Install node_modules
        if: steps.node-cache.outputs.cache-hit != 'true'
        run: cd web && npm ci

      - name: Build Web
        run: cd web && npm run build:wasm

      - name: Save node_modules Cache
        if: ${{ (github.event_name == 'push') && (steps.node-cache.outputs.cache-hit != 'true') }}
        uses: actions/cache/save@v4
        with:
          path: web/node_modules
          key: node-modules-web-${{ hashFiles('web/package-lock.json') }}

      - name: Job Failed
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: web_build
          path: |
            web/build
            web/lib/wasm

  ohos:
    needs: third-party
    runs-on: macos-latest
    steps:
      - name: Check Out Repo
        uses: actions/checkout@v4

      - name: Get CLI Tools Cache
        id: cli-tools-cache
        uses: actions/cache@v4
        with:
          path: ~/ohos-cmd-tools
          key: ohos-cli-6.0.0.868-mac-arm64-v2

      - name: Install CLI Tools
        if: steps.cli-tools-cache.outputs.cache-hit != 'true'
        run: |
          TOOLS_URL="https://github.com/libpag/ohos-sdk/releases/download/6.0.0.868/commandline-tools-mac-arm64-6.0.0.868.zip"
          curl -L -o /tmp/cmdtools.zip "$TOOLS_URL"
          unzip -q /tmp/cmdtools.zip -d /tmp
          mv /tmp/command-line-tools ~/ohos-cmd-tools

      - name: Save CLI Tools Cache
        if: steps.cli-tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/ohos-cmd-tools
          key: ohos-cli-6.0.0.868-mac-arm64-v2

      - name: Configure Environment
        run: |
          CLI_DIR=~/ohos-cmd-tools
          echo "$CLI_DIR/sdk/default/openharmony/toolchains" >> $GITHUB_PATH
          echo "$CLI_DIR/ohpm/bin"                       >> $GITHUB_PATH
          echo "$CLI_DIR/hvigor/bin"                     >> $GITHUB_PATH
          echo "DEVECO_SDK_HOME=$CLI_DIR/sdk"            >> $GITHUB_ENV
          echo "JAVA_HOME=$JAVA_HOME"                    >> $GITHUB_ENV

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup pnpm
        run: |
          npm install -g pnpm@8.13.1
          echo "$(npm prefix -g)/bin" >> $GITHUB_PATH

      - name: Cache hvigor & ohpm
        uses: actions/cache@v4
        with:
          path: |
            ~/.hvigor
            ~/.ohpm
            ohos/.hvigor
          key: hvigor-${{ runner.os }}-${{ hashFiles('**/oh-package.json5', '**/hvigorfile.ts') }}
          restore-keys: |
            hvigor-${{ runner.os }}-

      - name: Get Third-Party Cache
        uses: actions/cache/restore@v4
        with:
          path: third_party
          key: third-party-${{ hashFiles('DEPS') }}
          restore-keys: third-party-

      - uses: tecolicom/actions-use-homebrew-tools@v1
        with:
          tools: ninja yasm

      - name: Install ohpm dependencies
        run: |
          cd ohos
          ohpm config set registry https://ohpm.openharmony.cn/ohpm/
          ohpm install --all

      - name: Build Harmony
        run: |
          cd ohos
          hvigorw assembleHar --mode module -p module=libseatcanvas@default -p buildMode=release -p product=default --no-daemon

      - name: Job Failed
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: ohos_build
          path: ohos/out
