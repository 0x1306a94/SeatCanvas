name: autotest

on:
  workflow_dispatch:
  pull_request:
    branches: [master, develop]
  push:
    branches: [master, develop]

jobs:
  autotest:
    runs-on: macos-26
    steps:
      - name: Check Out Repo
        uses: actions/checkout@v4

      - name: Get Third-Party Cache
        id: third-party-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            third_party
          key: third-party-autotest-${{ hashFiles('DEPS') }}
          restore-keys: |
            third-party-mac-${{ hashFiles('DEPS') }}
            third-party-autotest-

      - uses: tecolicom/actions-use-homebrew-tools@v1
        with:
          tools: cmake ninja yasm git-lfs 0x1306a94/tap/depctl

      - name: Run depctl
        run: |
          depctl --version
          depctl --skip-paths third_party/tgfx/third_party/shaderc
        shell: bash

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.4.1"

      - name: Run autotest
        run: ./autotest.sh clean

      - name: Save Third-Party Cache
        if: ${{ (github.event_name == 'push') && (steps.third-party-cache.outputs.cache-hit != 'true') }}
        uses: actions/cache/save@v4
        with:
          path: |
            third_party
          key: third-party-autotest-${{ hashFiles('DEPS') }}

      - name: Upload Test Output
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: autotest_out
          path: tests/out/
          if-no-files-found: ignore
